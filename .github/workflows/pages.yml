name: Deploy static site to GitHub Pages

# Validates the corpus and downstream preview export, stages ONLY the public static site
# files ({index.html, browser/, quotes.csv, sources.csv}) into _site/, and publishes _site/
# to GitHub Pages so repository scripts, ops/, exports/, and docs are never exposed publicly.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate corpus and preview export
        run: |
          python3 scripts/validate_quotes.py
          python3 scripts/validate_homepage_preview_export.py

      - name: Stage public site artifact
        run: |
          mkdir -p _site
          cp index.html quotes.csv sources.csv _site/
          cp -R browser _site/browser

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
