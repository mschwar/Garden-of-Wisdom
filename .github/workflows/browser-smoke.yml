name: Quote browser smoke test

# Drives the real page in headless Chromium: it must load 324 quotes, filter, sort, copy,
# and lay out without horizontal overflow at phone/tablet widths. This is the automated
# replacement for the manual Claude-in-Chrome checks recorded in
# docs/architecture/QUOTE_BROWSER.md, and the guard on the repo-root layout the Pages
# deploy depends on (the page fetches ../quotes.csv, so rooting the site at browser/ would
# render zero quotes — the smoke test fails loudly if that happens).
#
# It is independent of the Pages deploy: this workflow never publishes anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    # 30, not 15: the last step re-applies the whole negative-control table, which means re-running
    # validate_quotes.py 6x and check_garden_e2e.py 3x on purpose (~4 min warm on a developer
    # Mac; more on a 2-core runner). That cost is the point of the step -- a table checked only
    # for rot would not be evidence -- so the budget is raised rather than the coverage cut.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run the browser smoke test
        run: python scripts/smoke_quote_browser.py

      - name: Check the data validators still pass
        run: |
          python scripts/validate_quotes.py
          python scripts/check_program_contracts.py
          python scripts/validate_homepage_preview_export.py

      - name: Guard the Pages deploy contract
        run: python scripts/check_pages_contract.py

      - name: Run the W1 corpus-program acceptance suites
        run: |
          python scripts/check_garden_store.py
          python scripts/check_garden_envelope.py
          python scripts/check_garden_submit.py
          python scripts/check_garden_normalize.py
          python scripts/check_garden_review.py
          python scripts/check_garden_e2e.py
          python scripts/check_garden_ledger.py
          python scripts/check_garden_legacy_batch.py
          python scripts/check_garden_lifecycle.py

      # Proven falsifiability, not a claim about it: each entry in the committed control table
      # is re-applied to a throwaway copy of this tree and the checker must go red with that
      # control's own FAIL: line. A mutation that no longer turns its checker red is reported
      # as a coverage gap and fails the job (issue #43). The browsers' controls need the
      # Chromium installed above, which is why this step lives in this job.
      - name: Machine-check the checkers' negative controls
        run: python scripts/run_negative_controls.py
