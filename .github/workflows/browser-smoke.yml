name: Quote browser smoke test

# Manual workflow_dispatch verification for the static quote browser, corpus validators,
# and pytest suite. Never runs on pull_request events (cloud-VM PR workflows are retired).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run corpus and export validators
        run: |
          python scripts/validate_quotes.py
          python scripts/validate_homepage_preview_export.py

      - name: Run pytest suite
        run: pytest

      - name: Run the browser smoke test
        run: python scripts/smoke_quote_browser.py
